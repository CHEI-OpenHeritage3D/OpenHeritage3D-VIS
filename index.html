<script>
		// zones.json decides how the scene loads. A schema-2 file describes the
		// whole scene (scene_config.js). Otherwise config.js loads the clouds as
		// before, and a dataset without one gets every cloud in its potree/
		// folder (default_zone.js).

		// params = new URLSearchParams(document.location.search);
		window.doi = params.get("doi");
		window.configURL = datasetPrefix + doi + "/potree/config.js";

		window.acceptedTerms = params.get("acceptedTerms");

		window.zoneURL = datasetPrefix + doi + "/potree/zones.json";
		window.classificationURL = datasetPrefix + doi + "/potree/classification_edits.gz";

		setAutoSwitchState(true);

		// Browsers cache libs/custom/*.js heuristically, so this page can meet a zone_creation.js
		// from before fetchZonesFile() existed; that one can only load config.js, which it still can.
		const zonesFile = typeof fetchZonesFile === "function" ? fetchZonesFile(window.zoneURL) : Promise.resolve(null);
		zonesFile.then(data => {
			if (typeof isSceneConfigFile === "function" && isSceneConfigFile(data)) {
				console.log("Scene loaded from zones.json (schema 2):", zoneURL);
				setTitle();
				initSceneFromConfig(data, zoneURL).catch(err => console.error("Failed to set up the scene from zones.json:", err));
			} else {
				loadConfigScript(data);
			}
		});

		// Every cloud in the dataset's potree/ folder (default_zone.js). A default_zone.js cached from
		// before initDefaultScene() can only wait for clouds that never come, but zones can still be imported.
		function loadDefaultScene(zonesData, keepCamera) {
			if (typeof initDefaultScene !== "function") return initZones();
			initDefaultScene(zonesData, keepCamera).catch(err => console.error("Failed to set up the default scene:", err));
		}

		// Loads the config Script which loads pointclouds and other overriding settings.
		// zonesData: an old-style zones.json, or null when the dataset has none.
		function loadConfigScript(zonesData) {
			const newScript = document.createElement("script");
			newScript.src = configURL;

			// tries to load config
			newScript.onload = () => {
				console.log("Config loaded:", configURL);
				setTitle();

				// A config.js can ask for the dataset's own clouds and only add to them (it has
				// placed the camera already); otherwise it has loaded the clouds itself.
				if (window.loadDefaultConfigFirst) loadDefaultScene(zonesData, true);
				else initZones();

				// loadMarker360s();
			};

			newScript.onerror = () => {
				console.log("No config.js; loading every point cloud in", configURL.replace(/config\.js$/, ""));
				setTitle();
				loadDefaultScene(zonesData, false);
			};

			document.body.appendChild(newScript);
		}

	</script>
	<script>

        function loop(timestamp) {
			requestAnimationFrame(loop);

			window.viewer.update(viewer.clock.getDelta(), timestamp);
			viewer.render();

			window.animateBeacons();
			window.animateMarker360s();
			// Cesium basemap behind the clouds, while a zone's background is "cesium" (cesium_basemap.js)
			if (window.CesiumBasemap) CesiumBasemap.render();
		}

        requestAnimationFrame(loop);

    </script>


	<script>
		async function setTitle(){

			const title = await fetchProjectTitle(window.doi);
			await fetchProjectCitationLicense(window.doi);
			window.docTitle = title || window.doi;


			document.title = window.docTitle + " | " + window.websiteName;

			const oh3dLink = window.website + "/project.php?id=" + window.doi;

			console.log(window.website);
			if(window !== window.top){
				document.getElementById("viewer-title").innerHTML = `<span style="opacity:0.9"><a> ${window.docTitle} | <img src="${window.website}/images/transparent-White.png" style="height:25px; margin-left:6px; vertical-align:middle; opacity:0.8;"></a></span>`;
			}
			else{
				document.getElementById("viewer-title").innerHTML = `<span style="opacity:0.9"><a href=${oh3dLink}> ${window.docTitle} | <img src="${window.website}/images/transparent-White.png" style="height:25px; margin-left:6px; vertical-align:middle; opacity:0.8;"><img src="images/icons8-arrow-24.png"
					style="width:14px; height:14px; margin-left:6px; vertical-align:middle; opacity:0.8;"></a></span>`;
			}

			positionTitle();
		}

		async function fetchProjectTitle(doi) {
			const url = `${window.website}/api/project_title.php?doi=${encodeURIComponent(doi)}`;
			console.log(url);
			try {
				const res = await fetch(url);
				if (!res.ok) {
					console.error("Failed to fetch project title:", res.status);
					return null;
				}

				const data = await res.json();
				return data.title +", "+data.country || null;

			} catch (err) {
				console.error("Error fetching project title:", err);
				return null;
			}
		}

		async function fetchProjectCitationLicense(doi) {
			const url = `${window.website}/api/project_citation.php?doi=${encodeURIComponent(doi)}`;
			console.log(url);
			try {
				const res = await fetch(url);
				if (!res.ok) {
					console.error("Failed to fetch project citation:", res.status);
					return null;
				}

				const data = await res.json();
				window.projectCitation = data.citation;
				    return {
						citation:    data.citation     || null,
						licenseName: data.license_type || null,
						licenseUrl:  data.license_link || null,
					};

			} catch (err) {
				console.error("Error fetching project license:", err);
				return null;
			}
		}

	</script>
