	<script>
		if (window !== window.top) {

			window.vtype = params.get("vtype");

				ac: {
					datasetPrefix: "https://pointcloud.ucsd.edu/archive_temp/oh3d_store/oh3d-vis/alertca_datasets/",
					website: "https://alertcalifornia.digital-atlas.org",
					websiteName: "ALERTCalifornia Archive"
				},
				oh3d: {
					datasetPrefix: "https://pointcloud.ucsd.edu/archive_temp/oh3d_store/oh3d-vis/datasets/",
					website: "https://openheritage3d.org",
					websiteName: "OpenHeritage3D"
				},
				kvap: {
					datasetPrefix: "https://pointcloud.ucsd.edu/archive_temp/oh3d_store/oh3d-vis/kvap_datasets/",
					website: "https://kvap.digital-atlas.org",
					websiteName: "KVAP"
				},
				oo3d: {
					datasetPrefix: "https://pointcloud.ucsd.edu/archive_temp/oh3d_store/remote-vis/openocean3d_vis/",
					website: "https://openocean3d.org",
					websiteName: "OpenOcean3D"
				}
			};

			// fallback defaults
			const DEFAULT_CONFIG = {
				datasetPrefix: "https://pointcloud.ucsd.edu/archive_temp/oh3d_store/oh3d-vis/datasets/",
				website: null
			};

			const cfg = VTYPE_CONFIG[window.vtype] || DEFAULT_CONFIG;

			window.datasetPrefix = cfg.datasetPrefix;
			window.website = cfg.website;
			window.websiteName = cfg.websiteName;


			document.title = window.websiteName + " | Potree Viewer";

			

			// Creates Viewer
			window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
			viewer.renderer.setAnimationLoop(null);
			viewer.setEDLEnabled(true);
			viewer.useHQ = false;
			viewer.setFOV(60);
			viewer.setPointBudget(5*1000*1000);
			viewer.setBackground("gradient");// ["skybox", "gradient", "black", "white"];
			viewer.loadSettingsFromURL();
			viewer.setClassifications({
	
			0:       { visible: true, name: 'never classified'  , color: [0.5,  0.5,  0.5,  1.0] },
			1:       { visible: true, name: 'unclassified'      , color: [0.5,  0.5,  0.5,  1.0] },
			2:       { visible: true, name: 'ground'            , color: [0.63, 0.32, 0.18, 1.0] },
			3:       { visible: true, name: 'low vegetation'    , color: [0.0,  1.0,  0.0,  1.0] },
			4:       { visible: true, name: 'medium vegetation' , color: [0.0,  0.8,  0.0,  1.0] },
			5:       { visible: true, name: 'high vegetation'   , color: [0.0,  0.6,  0.0,  1.0] },
			6:       { visible: true, name: 'building'          , color: [1.0,  0.66, 0.0,  1.0] },
			7:       { visible: false, name: 'low point(noise)'  , color: [1.0,  0.0,  1.0,  1.0] },
			8:       { visible: true, name: 'key-point'         , color: [1.0,  0.0,  0.0,  1.0] },
			9:       { visible: true, name: 'water'             , color: [0.0,  0.0,  1.0,  1.0] },
			12:      { visible: true, name: 'overlap'           , color: [1.0,  1.0,  0.0,  1.0] },
			17:      { visible: true, name: 'Bridge Deck'       , color: [0.384, 0.624, 0.808, 1.0]},
			18:      { visible: false, name: 'High Point (Noise)', color: [0.94,  0.60,  0.95,  1.0]},
			DEFAULT: { visible: true, name: 'default'           , color: [0.3,  0.6,  0.6,  0.5] },
		
			});

			viewer.compass.setVisible(false);	// compass disabled
			
			viewer.loadGUI(() => {
				viewer.setLanguage('en');
				$("#menu_appearance").next().show();
				$("#menu_tools").next().show();
				$("#menu_scene").next().show();
				//viewer.toggleSidebar();

	<script>
		async function setTitle(){

			const title = await fetchProjectTitle(window.doi);
			await fetchProjectCitationLicense(window.doi);
			window.docTitle = title || window.doi;


			document.title = window.docTitle + " | " + window.websiteName;

			const oh3dLink = window.website + "/project.php?id=" + window.doi;

			console.log(window.website);
			if(window !== window.top){
				document.getElementById("viewer-title").innerHTML = `<span style="opacity:0.9"><a> ${window.docTitle} | <img src="${window.website}/images/transparent-White.png" style="height:25px; margin-left:6px; vertical-align:middle; opacity:0.8;"></a></span>`;
			}
			else{
				document.getElementById("viewer-title").innerHTML = `<span style="opacity:0.9"><a href=${oh3dLink}> ${window.docTitle} | <img src="${window.website}/images/transparent-White.png" style="height:25px; margin-left:6px; vertical-align:middle; opacity:0.8;"><img src="images/icons8-arrow-24.png"
					style="width:14px; height:14px; margin-left:6px; vertical-align:middle; opacity:0.8;"></a></span>`;
			}

			positionTitle();
		}

		async function fetchProjectTitle(doi) {
			const url = `${window.website}/api/project_title.php?doi=${encodeURIComponent(doi)}`;
			console.log(url);
			try {
				const res = await fetch(url);
				if (!res.ok) {
					console.error("Failed to fetch project title:", res.status);
					return null;
				}

				const data = await res.json();
				return data.title +", "+data.country || null;

			} catch (err) {
				console.error("Error fetching project title:", err);
				return null;
			}
		}

		async function fetchProjectCitationLicense(doi) {
			const url = `${window.website}/api/project_citation.php?doi=${encodeURIComponent(doi)}`;
			console.log(url);
			try {
				const res = await fetch(url);
				if (!res.ok) {
					console.error("Failed to fetch project citation:", res.status);
					return null;
				}

				const data = await res.json();
				window.projectCitation = data.citation;
				    return {
						citation:    data.citation     || null,
						licenseName: data.license_type || null,
						licenseUrl:  data.license_link || null,
					};

			} catch (err) {
				console.error("Error fetching project license:", err);
				return null;
			}
		}

	</script>

	{ // MEASURE
		elToolbar.find("img[name=action_measure_point]").click( () => {
			const measurement = viewer.measuringTool.startInsertion({
				showDistances: false,
				showAngles: false,
				showCoordinates: true,
				showArea: false,
				closed: true,
				maxMarkers: 1,
				name: 'Point'
			});
		});

		elToolbar.find("img[name=action_measure_distance]").click( () => {
			const measurement = viewer.measuringTool.startInsertion({
				showDistances: true,
				showArea: false,
				closed: false,
				name: 'Distance'
			});
		});
		
		elToolbar.find("img[name=action_measure_height]").click( () => {
			const measurement = viewer.measuringTool.startInsertion({
				showDistances: false,
				showHeight: true,
				showArea: false,
				closed: false,
				maxMarkers: 2,
				name: 'Height'
			});
		});
		elToolbar.find("img[name=action_reset_tools]").click( () => {
				const measurement = this.viewer.scene.removeAllMeasurements();
		});

	}

	{ // MATERIAL
		let options = [
			"RGBA", 
			"Classification",
			"RGBA Classes",
			"Intensity Classes",
			"Elevation",
			"Intensity",
			"Color",
			//"indices",
			// "intensity",
			// "source id",
		];

		let attributeSelection = elToolbar.find('#optMaterial');
		for(let option of options){
			let elOption = $(`<option>${option}</option>`);
			attributeSelection.append(elOption);
		}

		const updateMaterialSelection = (event, ui) => {
			let selectedValue = attributeSelection.selectmenu().val();

			for(const pointcloud of viewer.scene.pointclouds){
				pointcloud.material.activeAttributeName = selectedValue;
			}
		};

		attributeSelection.on("change", () => {
		let selected = attributeSelection.val();
		
		for (const pointcloud of viewer.scene.pointclouds){

			if(selected === "RGBA Classes"){
				pointcloud.material.activeAttributeName = "composite";
				pointcloud.material.weightRGBA = [100];
				pointcloud.material.weightIntensity = [0];
				pointcloud.material.intensityRange = [16, 65000];
				pointcloud.material.weightClassification = [0.75];
			}
			else if(selected === "Intensity Classes"){
				pointcloud.material.activeAttributeName = "composite";
				pointcloud.material.weightRGBA = [0];
				pointcloud.material.weightIntensity = [90];
				pointcloud.material.intensityRange = [16, 65000];
				pointcloud.material.weightClassification = [10];
			}
			else {
				pointcloud.material.activeAttributeName = selected.toLowerCase();
			}
		}
	});
