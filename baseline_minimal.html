<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Potree Baseline</title>

    <link rel="stylesheet" type="text/css" href="build/potree/potree.css">

    <style>
        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #potree_render_area {
            background-image: url('./build/potree/resources/images/background.jpg');
        }
    </style>
</head>

<body>

    	<!-- <script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>
	<link href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css" rel="stylesheet"> -->
	<script src="libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="libs/spectrum/spectrum.js"></script>
	<script src="libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="libs/three.js/build/three.js"></script>
<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.js"></script> -->
	<script src="libs/other/BinaryHeap.js"></script>
	<script src="libs/tween/tween.min.js"></script>
	<script src="libs/d3/d3.js"></script>
	<script src="libs/proj4/proj4.js"></script>
	<script src="libs/openlayers3/ol.js"></script>
	<script src="libs/i18next/i18next.js"></script>
	<script src="libs/jstree/jstree.js"></script>
	<script src="libs/plasio/js/laslaz.js"></script>

    <script src="build/potree/potree.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">

		<div id="potree_render_area">
			<div id="viewer-title" style="z-index: 200000;"></div>
			<!-- <video id="webcam"></video> -->
			<div id="toolbar-wrapper" style="z-index: 200000;">
				<div id="toolbar-toggle">▼</div>
				<div id="potree_toolbar"></div>
			</div>
        <div id="photo360" style="display:none; position:absolute; inset:0; z-index:10000;">
            <div id="viewer-360" style="width:100%; height:100%;"></div>
        </div>
		<div id="cesiumContainer" style="position: absolute; width: 100%; height: 100%; background-color:black">
		</div>
		</div>
		<div id="potree_sidebar_container"></div>
	</div>

    <script>
        // Note: viewer.loadGUI() (the sidebar with tree/material/tools panels)
        // needs jQuery + jQuery-UI loaded globally (potree.js calls
        // sidebarContainer.load(...) and .draggable() internally) plus
        // spectrum/jstree/i18next for the sidebar template itself. Left out
        // here since this page is meant to be dependency-free.

        window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

        viewer.setEDLEnabled(true);
        viewer.setFOV(60);
        viewer.setPointBudget(2 * 1000 * 1000);
        viewer.setBackground("gradient"); // "skybox", "gradient", "black", "white", "none"
        viewer.loadSettingsFromURL();
		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
			$("#menu_tools").next().show();
			$("#menu_scene").next().show();
			viewer.toggleSidebar();
		});
        // Swap this URL/name for whichever point cloud you want to test.
        Potree.loadPointCloud("https://pointcloud.ucsd.edu/italy/florence/pointclouds/1_santa_maria_novella/fiaw_santa_maria_novella_2024/metadata.json", "pointcloud", e => {
            let pointcloud = e.pointcloud;
            let material = pointcloud.material;

            material.activeAttributeName = "rgba";
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;

            viewer.scene.addPointCloud(pointcloud);
            pointcloud.visible = true;

            viewer.fitToScreen();
        });

        function loop(timestamp) {
            requestAnimationFrame(loop);
            viewer.update(viewer.clock.getDelta(), timestamp);
            viewer.render();
        }
        requestAnimationFrame(loop);
    </script>

</body>

</html>
